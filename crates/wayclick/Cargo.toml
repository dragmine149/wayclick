[package]
name = "wayclick"
version.workspace = true
edition.workspace = true

[dependencies]
clap = { version = "4.6.6", features = ["default", "derive"] }
dirs.workspace = true
futures = {
  version = "0.3.32",
}
reqwest = {
  version = "0.13.4",
  features = ["blocking", "json"],
}
tokio = {
  workspace = true,
}
wayclick_click.workspace = true
wayclick_frontend = {
  workspace = true,
  optional = true,
}
wayclick_schema.workspace = true

[features]
default = ["full"]
full = ["macros", "ui"]
macros = []
ui = ["dep:wayclick_frontend"]
