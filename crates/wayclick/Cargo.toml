[package]
name = "wayclick"
version.workspace = true
edition.workspace = true

[dependencies]
clap = { version = "4.6.6", features = ["default", "derive"] }
dirs.workspace = true
wayclick_frontend = {
  workspace = true,
  optional = true,
}

[features]
default = ["full"]
full = ["macros", "ui"]
macros = []
ui = ["dep:wayclick_frontend"]
