[package]
name = "wayclick"
version = "0.1.0"
edition = "2024"
rust-version = "1.88.0"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.54", features = ["derive"] }
derive_builder = "0.20.2"
dirs = "6.0.0"
enigo = { version = "0.6.1", features = ["wayland"] }
evdev = "0.13.2"
gpui = "0.2.2"
gpui-component = { version = "0.5.0", features = ["inspector"] }
gpui-component-assets = "0.5.0"
itertools = "0.14.0"
nix = { version = "0.30.1", features = ["fs", "signal"] }
notify-rust = "4.11.7"
regex = "1.12.2"
serde = "1.0.228"
serde_json = "1.0.149"
