[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0"
async-channel = "2.5.0"
clap = { version = "4.5.54", features = ["derive"] }
derive_builder = "0.20.2"
dirs = "6.0.0"
enigo = { version = "0.6.1", features = ["wayland"] }
evdev = "0.13.2"
itertools = "0.14.0"
nix = { version = "0.30.1", features = ["fs", "signal"] }
notify = "8.2.0"
notify-rust = "4.11.7"
rand = "0.10.2"
regex = "1.12.2"
serde = "1.0.228"
serde_json = "1.0.149"
smol = "2.0.2"
strum = "0.28.0"
tokio = "1.53.1"

wayclick_frontend = { path = "crates/frontend/" }
